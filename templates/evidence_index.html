<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evidence Validation Engine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .evidence-status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .evidence-valid { background-color: #d4edda; border: 1px solid #c3e6cb; }
        .evidence-invalid { background-color: #f8d7da; border: 1px solid #f5c6cb; }
        .evidence-pending { background-color: #fff3cd; border: 1px solid #ffeaa7; }
        
        .task-card {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: box-shadow 0.3s;
        }
        .task-card:hover { box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        
        .evidence-upload-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin: 15px 0;
            transition: border-color 0.3s;
        }
        .evidence-upload-area:hover { border-color: #007bff; }
        
        .annotated-image {
            max-width: 100%;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin: 10px 0;
        }
        
        .validation-result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 5px;
        }

        .evidence-upload-options .btn-group .btn {
            border-radius: 0.375rem;
        }

        .multi-upload {
            border-color: #28a745;
        }

        .multi-upload:hover {
            border-color: #1e7e34;
        }

        .evidence-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .bg-light-success {
            background-color: #d1f2eb !important;
        }

        .bg-light-danger {
            background-color: #fadbd8 !important;
        }

        .accordion-button:not(.collapsed) {
            background-color: #e3f2fd;
        }
    </style>

    <!-- Annotation System Styles -->
    <link href="/static/annotation_system.css" rel="stylesheet">

    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <div class="container-fluid">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <i class="fas fa-shield-alt me-2"></i>Evidence Validation Engine
                </a>
            </div>
        </nav>

        <!-- Upload Audit Document Section -->
        <div class="row mb-4" id="uploadSection">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-upload me-2"></i>Step 1: Upload Audit Document</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <input type="file" class="form-control" id="auditFile" accept=".pdf">
                            <div class="form-text">Upload the audit PDF to extract tasks that need evidence validation.</div>
                        </div>
                        <button type="button" class="btn btn-primary" onclick="uploadAudit()">
                            <i class="fas fa-file-upload me-2"></i>Process Audit Document
                        </button>
                        <div id="uploadProgress" class="mt-3" style="display: none;">
                            <div class="d-flex align-items-center">
                                <div class="spinner-border spinner-border-sm text-primary me-2"></div>
                                <span>Processing document...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tasks and Evidence Section -->
        <div class="row" id="tasksSection" style="display: none;">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-tasks me-2"></i>Step 2: Upload Evidence for Tasks</h5>
                        <span class="badge bg-info" id="tasksCount">0 tasks</span>
                    </div>
                    <div class="card-body">
                        <div id="tasksContainer"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentObservations = [];

        async function uploadAudit() {
            const fileInput = document.getElementById('auditFile');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a PDF file');
                return;
            }

            document.getElementById('uploadProgress').style.display = 'block';
            
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload_audit', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                if (result.success) {
                    currentObservations = result.observations_with_tasks;
                    displayTasks();
                    document.getElementById('tasksSection').style.display = 'block';
                    document.getElementById('tasksCount').textContent = `${result.total_tasks} tasks`;
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error uploading file: ' + error.message);
            } finally {
                document.getElementById('uploadProgress').style.display = 'none';
            }
        }

        function getTotalTasks() {
            return currentObservations.reduce((total, [obs, tasks]) => total + tasks.length, 0);
        }

        function displayTasks() {
            const container = document.getElementById('tasksContainer');
            container.innerHTML = '';

            currentObservations.forEach(([observation, tasks], obsIdx) => {
                const obsCard = document.createElement('div');
                obsCard.className = 'card mb-4';
                obsCard.innerHTML = `
                    <div class="card-header">
                        <h6 class="mb-0">Observation ${obsIdx + 1}: ${observation.observation_title || 'Unnamed'} (${tasks.length} tasks)</h6>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <strong>Description:</strong> ${observation.observation_description || 'No description'}
                        </div>
                        <div id="tasks-${obsIdx}">
                            ${tasks.map((task, taskIdx) => createTaskCard(task, obsIdx, taskIdx)).join('')}
                        </div>
                    </div>
                `;
                container.appendChild(obsCard);
            });
        }

        function createTaskCard(task, obsIdx, taskIdx) {
            const taskLetter = String.fromCharCode(65 + taskIdx);
            return `
                <div class="task-card p-3 mb-3" id="task-${obsIdx}-${taskIdx}">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <h6 class="mb-0">Task ${obsIdx + 1}${taskLetter}</h6>
                        <div class="evidence-status evidence-pending" id="status-${obsIdx}-${taskIdx}">
                            <i class="fas fa-clock me-1"></i>Awaiting Evidence
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <strong>Task Description:</strong>
                        <p class="mt-1">${task.task_text || 'No description available'}</p>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <small class="text-muted">Department:</small><br>
                            <span>${task.inferred_department || 'Not specified'}</span>
                        </div>
                        <div class="col-md-4">
                            <small class="text-muted">Implementation Type:</small><br>
                            <span>${task.implementation_type || 'Not specified'}</span>
                        </div>
                        <div class="col-md-4">
                            <small class="text-muted">Division:</small><br>
                            <span>${task.inferred_division || 'Not specified'}</span>
                        </div>
                    </div>
                    
                    <!-- Upload Options -->
                    <div class="evidence-upload-options mb-3">
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-outline-primary active" onclick="showSingleUpload(${obsIdx}, ${taskIdx})" id="single-btn-${obsIdx}-${taskIdx}">
                                <i class="fas fa-file me-1"></i>Single Document
                            </button>
                            <button type="button" class="btn btn-outline-success" onclick="showMultiUpload(${obsIdx}, ${taskIdx})" id="multi-btn-${obsIdx}-${taskIdx}">
                                <i class="fas fa-files me-1"></i>Multiple Documents
                            </button>
                        </div>
                    </div>

                    <!-- Single Document Upload -->
                    <div class="evidence-upload-area single-upload" id="single-upload-${obsIdx}-${taskIdx}" onclick="document.getElementById('evidence-${obsIdx}-${taskIdx}').click()">
                        <i class="fas fa-cloud-upload-alt fa-2x text-muted mb-2"></i>
                        <p class="mb-0">Click to upload single evidence document</p>
                        <small class="text-muted">Supported formats: PDF, JPG, PNG, GIF, WebP</small>
                    </div>

                    <!-- Multiple Documents Upload -->
                    <div class="evidence-upload-area multi-upload" id="multi-upload-${obsIdx}-${taskIdx}" style="display: none;" onclick="document.getElementById('evidence-multi-${obsIdx}-${taskIdx}').click()">
                        <i class="fas fa-cloud-upload-alt fa-2x text-muted mb-2"></i>
                        <p class="mb-0">Click to upload multiple evidence documents</p>
                        <small class="text-muted">Select multiple files (Max 10 documents) - Ctrl+Click or Cmd+Click to select multiple</small>
                    </div>

                    <input type="file" id="evidence-${obsIdx}-${taskIdx}" style="display: none;"
                           accept=".pdf,.jpg,.jpeg,.png,.gif,.webp"
                           onchange="showDescriptionModal(${obsIdx}, ${taskIdx}, this, false)">

                    <input type="file" id="evidence-multi-${obsIdx}-${taskIdx}" style="display: none;"
                           accept=".pdf,.jpg,.jpeg,.png,.gif,.webp" multiple
                           onchange="showDescriptionModal(${obsIdx}, ${taskIdx}, this, true)">

                    <!-- Evidence Management Area -->
                    <div id="evidence-management-${obsIdx}-${taskIdx}" class="evidence-management mt-3" style="display: none;">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="mb-0">Uploaded Evidence</h6>
                            <span class="badge bg-info" id="evidence-count-${obsIdx}-${taskIdx}">0 documents</span>
                        </div>
                        <div id="evidence-list-${obsIdx}-${taskIdx}" class="evidence-list"></div>
                        <button class="btn btn-success btn-sm mt-2" onclick="addMoreEvidence(${obsIdx}, ${taskIdx})">
                            <i class="fas fa-plus me-1"></i>Add More Evidence
                        </button>
                    </div>

                    <div id="validation-result-${obsIdx}-${taskIdx}"></div>
                </div>
            `;
        }

        function showDescriptionModal(obsIdx, taskIdx, fileInput, isMultiple = false) {
            const files = isMultiple ? Array.from(fileInput.files) : [fileInput.files[0]];
            if (!files || files.length === 0) return;

            const fileListHTML = files.map(file => `<li>${file.name}</li>`).join('');
            const submitButtonText = isMultiple ? `Submit ${files.length} Evidence Documents` : 'Submit Evidence';

            // Create modal HTML
            const modalHTML = `
                <div class="modal fade" id="descriptionModal" tabindex="-1">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">${isMultiple ? 'Multiple ' : ''}Evidence Description</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <p><strong>Selected file${isMultiple ? 's' : ''}:</strong></p>
                                <ul>${fileListHTML}</ul>
                                <div class="mb-3">
                                    <label class="form-label">How ${isMultiple ? 'do these documents provide' : 'does this document provide'} evidence for task completion?</label>
                                    <textarea class="form-control" id="evidenceDescription" rows="4"
                                              placeholder="Explain how ${isMultiple ? 'these documents demonstrate' : 'this document demonstrates'} that the audit task has been completed. Be specific about what ${isMultiple ? 'the documents show' : 'the document shows'} and how ${isMultiple ? 'they relate' : 'it relates'} to the task requirements.${isMultiple ? ' If documents are complementary, explain how they work together.' : ''}"></textarea>
                                </div>
                                ${isMultiple ? `
                                <div class="alert alert-info">
                                    <i class="fas fa-info-circle me-2"></i>
                                    <strong>Multi-Document Analysis:</strong> The AI will analyze all documents together to provide a comprehensive validation, looking for complementary evidence and cross-document consistency.
                                </div>
                                ` : ''}
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                <button type="button" class="btn btn-primary" onclick="submitEvidence(${obsIdx}, ${taskIdx}, ${isMultiple})">
                                    ${submitButtonText}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Remove existing modal if any
            const existingModal = document.getElementById('descriptionModal');
            if (existingModal) {
                existingModal.remove();
            }

            // Add modal to body
            document.body.insertAdjacentHTML('beforeend', modalHTML);

            // Show modal
            const modal = new bootstrap.Modal(document.getElementById('descriptionModal'));
            modal.show();

            // Store file reference
            window.currentEvidenceFiles = files;
            window.currentIsMultiple = isMultiple;
        }

        async function submitEvidence(obsIdx, taskIdx, isMultiple) {
            const description = document.getElementById('evidenceDescription').value.trim();
            const files = window.currentEvidenceFiles;

            if (!files || files.length === 0) {
                alert('Files not found. Please try uploading again.');
                return;
            }

            // Close modal
            const modal = bootstrap.Modal.getInstance(document.getElementById('descriptionModal'));
            modal.hide();

            if (isMultiple) {
                await uploadMultipleEvidence(obsIdx, taskIdx, files, description);
            } else {
                await uploadEvidence(obsIdx, taskIdx, files[0], description);
            }
        }

        async function uploadEvidence(obsIdx, taskIdx, file, userDescription = '') {
            if (!file) return;

            const [observation, tasks] = currentObservations[obsIdx];
            const task = tasks[taskIdx];
            const statusElement = document.getElementById(`status-${obsIdx}-${taskIdx}`);
            const resultContainer = document.getElementById(`validation-result-${obsIdx}-${taskIdx}`);
            
            // Show uploading status
            statusElement.className = 'evidence-status evidence-pending';
            statusElement.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Validating Evidence...';
            
            const formData = new FormData();
            formData.append('evidence_file', file);
            formData.append('obs_idx', obsIdx);
            formData.append('task_idx', taskIdx);
            formData.append('task_description', task.task_text || '');
            formData.append('user_description', userDescription);
            formData.append('task_context', JSON.stringify({
                department: task.inferred_department,
                implementation_type: task.implementation_type,
                division: task.inferred_division,
                requires_collaboration: task.requires_collaboration
            }));
            formData.append('use_agentic', 'true');

            try {
                // Start progress monitoring
                const progressInterval = startProgressMonitoring(obsIdx, taskIdx);

                const response = await fetch('/upload_evidence_agent', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                // Stop progress monitoring
                clearInterval(progressInterval);
                
                if (result.error) {
                    statusElement.className = 'evidence-status evidence-invalid';
                    statusElement.innerHTML = '<i class="fas fa-exclamation-triangle me-1"></i>Validation Error';
                    resultContainer.innerHTML = `<div class="alert alert-danger">${result.error}</div>`;
                } else {
                    displayValidationResult(obsIdx, taskIdx, result);
                }
            } catch (error) {
                statusElement.className = 'evidence-status evidence-invalid';
                statusElement.innerHTML = '<i class="fas fa-exclamation-triangle me-1"></i>Upload Error';
                resultContainer.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        }

        function displayValidationResult(obsIdx, taskIdx, result) {
            const statusElement = document.getElementById(`status-${obsIdx}-${taskIdx}`);
            const resultContainer = document.getElementById(`validation-result-${obsIdx}-${taskIdx}`);
            
            // Update status
            if (result.is_valid) {
                statusElement.className = 'evidence-status evidence-valid';
                statusElement.innerHTML = '<i class="fas fa-check-circle me-1"></i>Evidence Accepted';
            } else {
                statusElement.className = 'evidence-status evidence-invalid';
                statusElement.innerHTML = '<i class="fas fa-times-circle me-1"></i>Evidence Rejected';
            }
            
            // Create result display
            let resultHTML = `
                <div class="validation-result ${result.is_valid ? 'bg-light-success' : 'bg-light-danger'}">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="mb-0">
                            <i class="fas fa-${result.is_valid ? 'check' : 'times'} me-2"></i>
                            Validation Result
                        </h6>
                        <span class="badge ${result.is_valid ? 'bg-success' : 'bg-danger'}">
                            ${Math.round(result.confidence * 100)}% Confidence
                        </span>
                    </div>
                    
                    <div class="mb-3">
                        <strong>AI Analysis:</strong>
                        <p class="mt-1">${result.reasoning}</p>
                    </div>
                    
                    <div class="row">
                        ${result.strengths && result.strengths.length > 0 ? `
                            <div class="col-md-6">
                                <strong class="text-success">Strengths:</strong>
                                <ul class="mt-1">
                                    ${result.strengths.map(s => `<li>${s}</li>`).join('')}
                                </ul>
                            </div>
                        ` : ''}
                        
                        ${result.missing_elements && result.missing_elements.length > 0 ? `
                            <div class="col-md-6">
                                <strong class="text-danger">Missing Elements:</strong>
                                <ul class="mt-1">
                                    ${result.missing_elements.map(m => `<li>${m}</li>`).join('')}
                                </ul>
                            </div>
                        ` : ''}
                    </div>
                    
                    <div class="mt-3">
                        <strong>Recommendation:</strong>
                        <span class="badge ${getRecommendationBadgeClass(result.recommendation)}">
                            ${result.recommendation ? result.recommendation.toUpperCase() : 'UNKNOWN'}
                        </span>
                    </div>
                </div>

                <!-- PDF Viewer Container -->
                <div class="pdf-viewer-container mt-4" id="pdf-viewer-${obsIdx}-${taskIdx}">
                    <div class="pdf-viewer-header d-flex justify-content-between align-items-center mb-2">
                        <h6 class="mb-0">
                            <i class="fas fa-file-pdf me-2"></i>Document Viewer
                        </h6>
                        <div class="pdf-controls">
                            <button class="btn btn-sm btn-outline-secondary" onclick="previousPage(${obsIdx}, ${taskIdx})">
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            <span class="mx-2" id="page-info-${obsIdx}-${taskIdx}">Page 1 of 1</span>
                            <button class="btn btn-sm btn-outline-secondary" onclick="nextPage(${obsIdx}, ${taskIdx})">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                    <div class="pdf-viewer-wrapper" style="position: relative; border: 1px solid #dee2e6; border-radius: 5px;">
                        <canvas id="pdf-canvas-${obsIdx}-${taskIdx}" style="width: 100%; height: auto;"></canvas>
                        <div id="pdf-annotations-${obsIdx}-${taskIdx}" class="pdf-annotations-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></div>
                    </div>
                </div>
            `;
            
            // Add annotated image if available
            if (result.annotated_image) {
                resultHTML += `
                    <div class="mt-3">
                        <h6><i class="fas fa-image me-2"></i>AI Analysis Visualization</h6>
                        <img src="/get_annotated_image/${result.annotated_image}" class="annotated-image" alt="Annotated Evidence">
                        <small class="text-muted d-block mt-1">
                            Green boxes highlight supporting evidence, red boxes indicate issues or missing elements.
                        </small>
                    </div>
                `;
            }
            
            resultContainer.innerHTML = resultHTML;

            // Initialize PDF viewer and annotations
            setTimeout(() => {
                // Initialize PDF viewer if we have a PDF file
                if (result.pdf_filename) {
                    initializePDFViewer(obsIdx, taskIdx, result.pdf_filename);
                }

                // Initialize annotations if they exist
                if (result.annotations && result.annotations.length > 0) {
                    console.log('Initializing annotations for result:', result.annotations);
                    initializeAnnotations(result.annotations, obsIdx, taskIdx);
                }

                // Add observer for PDF container visibility changes
                const pdfContainer = document.getElementById(`pdf-viewer-${obsIdx}-${taskIdx}`);
                if (pdfContainer) {
                    const observer = new MutationObserver(() => {
                        const key = `${obsIdx}-${taskIdx}`;
                        const viewer = window.pdfViewers?.get(key);
                        if (viewer && pdfContainer.offsetWidth > 0) {
                            setTimeout(() => {
                                viewer.repositionHighlights();
                            }, 100);
                        }
                    });
                    observer.observe(pdfContainer, {
                        attributes: true,
                        attributeFilter: ['style', 'class'],
                        childList: true,
                        subtree: true
                    });
                }
            }, 100);
        }

        function getRecommendationBadgeClass(recommendation) {
            switch(recommendation) {
                case 'accept': return 'bg-success';
                case 'reject': return 'bg-danger';
                case 'request_additional': return 'bg-warning';
                default: return 'bg-secondary';
            }
        }

        function showToast(message, type = 'info') {
            // Simple toast notification
            const toast = document.createElement('div');
            toast.className = `alert alert-${type} position-fixed top-0 end-0 m-3`;
            toast.style.zIndex = '9999';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        function startProgressMonitoring(obsIdx, taskIdx) {
            const statusElement = document.getElementById(`status-${obsIdx}-${taskIdx}`);

            return setInterval(async () => {
                try {
                    const response = await fetch('/agent_progress');
                    const progress = await response.json();

                    if (progress.current_step && progress.current_step !== 'Idle') {
                        statusElement.className = 'evidence-status evidence-pending';
                        const percentage = Math.round(progress.progress_percentage || 0);
                        statusElement.innerHTML = `
                            <div class="d-flex align-items-center">
                                <div class="spinner-border spinner-border-sm text-primary me-2"></div>
                                <div>
                                    <div>[AGENT] ${progress.current_step}</div>
                                    <div class="small text-muted">${percentage}% complete (${progress.completed_steps}/${progress.total_steps} steps)</div>
                                </div>
                            </div>
                        `;
                    }
                } catch (error) {
                    console.log('Progress monitoring error:', error);
                }
            }, 2000); // Poll every 2 seconds
        }

        // Multi-document upload functions
        function showSingleUpload(obsIdx, taskIdx) {
            // Update button states
            document.getElementById(`single-btn-${obsIdx}-${taskIdx}`).classList.add('active');
            document.getElementById(`multi-btn-${obsIdx}-${taskIdx}`).classList.remove('active');

            // Show/hide upload areas
            document.getElementById(`single-upload-${obsIdx}-${taskIdx}`).style.display = 'block';
            document.getElementById(`multi-upload-${obsIdx}-${taskIdx}`).style.display = 'none';
        }

        function showMultiUpload(obsIdx, taskIdx) {
            // Update button states
            document.getElementById(`single-btn-${obsIdx}-${taskIdx}`).classList.remove('active');
            document.getElementById(`multi-btn-${obsIdx}-${taskIdx}`).classList.add('active');

            // Show/hide upload areas
            document.getElementById(`single-upload-${obsIdx}-${taskIdx}`).style.display = 'none';
            document.getElementById(`multi-upload-${obsIdx}-${taskIdx}`).style.display = 'block';
        }

        async function uploadMultipleEvidence(obsIdx, taskIdx, files, userDescription = '') {
            if (!files || files.length === 0) return;

            const [observation, tasks] = currentObservations[obsIdx];
            const task = tasks[taskIdx];
            const statusElement = document.getElementById(`status-${obsIdx}-${taskIdx}`);
            const resultContainer = document.getElementById(`validation-result-${obsIdx}-${taskIdx}`);

            // Show uploading status
            statusElement.className = 'evidence-status evidence-pending';
            statusElement.innerHTML = `<i class="fas fa-spinner fa-spin me-1"></i>Analyzing ${files.length} Documents...`;

            const formData = new FormData();

            // Add all files
            for (let file of files) {
                formData.append('evidence_files', file);
            }

            formData.append('obs_idx', obsIdx);
            formData.append('task_idx', taskIdx);
            formData.append('task_description', task.task_text || '');
            formData.append('user_description', userDescription);
            formData.append('task_context', JSON.stringify({
                department: task.inferred_department,
                implementation_type: task.implementation_type,
                division: task.inferred_division,
                requires_collaboration: task.requires_collaboration
            }));

            try {
                // Start progress monitoring
                const progressInterval = startProgressMonitoring(obsIdx, taskIdx);

                const response = await fetch('/upload_multiple_evidence', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                // Stop progress monitoring
                clearInterval(progressInterval);

                if (result.error) {
                    statusElement.className = 'evidence-status evidence-invalid';
                    statusElement.innerHTML = '<i class="fas fa-exclamation-triangle me-1"></i>Validation Error';
                    resultContainer.innerHTML = `<div class="alert alert-danger">${result.error}</div>`;
                } else {
                    displayMultiDocumentResult(obsIdx, taskIdx, result);
                }
            } catch (error) {
                statusElement.className = 'evidence-status evidence-invalid';
                statusElement.innerHTML = '<i class="fas fa-exclamation-triangle me-1"></i>Upload Error';
                resultContainer.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        }

        function displayMultiDocumentResult(obsIdx, taskIdx, result) {
            const statusElement = document.getElementById(`status-${obsIdx}-${taskIdx}`);
            const resultContainer = document.getElementById(`validation-result-${obsIdx}-${taskIdx}`);

            // Update status
            if (result.is_valid) {
                statusElement.className = 'evidence-status evidence-valid';
                statusElement.innerHTML = `<i class="fas fa-check-circle me-1"></i>Evidence Package Accepted (${result.document_count} docs)`;
            } else {
                statusElement.className = 'evidence-status evidence-invalid';
                statusElement.innerHTML = `<i class="fas fa-times-circle me-1"></i>Evidence Package Rejected (${result.document_count} docs)`;
            }

            // Create result display
            let resultHTML = `
                <div class="validation-result ${result.is_valid ? 'bg-light-success' : 'bg-light-danger'}">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="mb-0">
                            <i class="fas fa-${result.is_valid ? 'check' : 'times'} me-2"></i>
                            Multi-Document Analysis Result
                        </h6>
                        <div>
                            <span class="badge ${result.is_valid ? 'bg-success' : 'bg-danger'} me-2">
                                ${Math.round(result.confidence * 100)}% Confidence
                            </span>
                            <span class="badge bg-info">
                                ${result.document_count} Documents
                            </span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <strong>Collective Analysis:</strong>
                        <p class="mt-1">${result.reasoning}</p>
                    </div>

                    ${result.document_synergy ? `
                        <div class="mb-3">
                            <strong>Document Synergy:</strong>
                            <p class="mt-1">${result.document_synergy}</p>
                        </div>
                    ` : ''}

                    <div class="row">
                        ${result.strengths && result.strengths.length > 0 ? `
                            <div class="col-md-6">
                                <strong class="text-success">Collective Strengths:</strong>
                                <ul class="mt-1">
                                    ${result.strengths.map(s => `<li>${s}</li>`).join('')}
                                </ul>
                            </div>
                        ` : ''}

                        ${result.missing_elements && result.missing_elements.length > 0 ? `
                            <div class="col-md-6">
                                <strong class="text-danger">Missing Elements:</strong>
                                <ul class="mt-1">
                                    ${result.missing_elements.map(m => `<li>${m}</li>`).join('')}
                                </ul>
                            </div>
                        ` : ''}
                    </div>

                    ${result.cross_document_findings && result.cross_document_findings.length > 0 ? `
                        <div class="mt-3">
                            <strong>Cross-Document Findings:</strong>
                            <div class="mt-2">
                                ${result.cross_document_findings.map(finding => `
                                    <div class="card mb-2">
                                        <div class="card-body py-2">
                                            <div class="d-flex justify-content-between">
                                                <strong>${finding.finding}</strong>
                                                <span class="badge bg-${finding.significance === 'high' ? 'danger' : finding.significance === 'medium' ? 'warning' : 'info'}">${finding.significance}</span>
                                            </div>
                                            <small class="text-muted">Documents: ${finding.documents_involved ? finding.documents_involved.join(', ') : 'N/A'}</small>
                                            ${finding.explanation ? `<p class="mb-0 mt-1">${finding.explanation}</p>` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <div class="mt-3">
                        <strong>Recommendation:</strong>
                        <span class="badge ${getRecommendationBadgeClass(result.recommendation)}">
                            ${result.recommendation ? result.recommendation.toUpperCase() : 'UNKNOWN'}
                        </span>
                    </div>
                </div>

                <!-- Individual Document Results -->
                ${result.individual_results && result.individual_results.length > 0 ? `
                    <div class="mt-4">
                        <h6><i class="fas fa-list me-2"></i>Individual Document Analysis</h6>
                        <div class="accordion" id="accordion-${obsIdx}-${taskIdx}">
                            ${result.individual_results.map((docResult, index) => `
                                <div class="accordion-item">
                                    <h2 class="accordion-header">
                                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-${obsIdx}-${taskIdx}-${index}">
                                            Document ${index + 1}: ${docResult.filename}
                                            <span class="badge ${docResult.result.is_valid ? 'bg-success' : 'bg-danger'} ms-2">
                                                ${docResult.result.is_valid ? 'Valid' : 'Invalid'}
                                            </span>
                                        </button>
                                    </h2>
                                    <div id="collapse-${obsIdx}-${taskIdx}-${index}" class="accordion-collapse collapse" data-bs-parent="#accordion-${obsIdx}-${taskIdx}">
                                        <div class="accordion-body">
                                            <strong>Individual Reasoning:</strong>
                                            <p>${docResult.result.reasoning || 'No detailed reasoning available'}</p>

                                            ${docResult.result.pdf_filename ? `
                                                <div class="pdf-viewer-container mt-3">
                                                    <div class="pdf-viewer-header d-flex justify-content-between align-items-center mb-2">
                                                        <h6 class="mb-0">
                                                            <i class="fas fa-file-pdf me-2"></i>Document Viewer
                                                        </h6>
                                                        <div class="pdf-controls">
                                                            <button class="btn btn-sm btn-outline-secondary" onclick="previousPage(${obsIdx}, ${taskIdx}, ${index})">
                                                                <i class="fas fa-chevron-left"></i>
                                                            </button>
                                                            <span class="mx-2" id="page-info-${obsIdx}-${taskIdx}-${index}">Page 1 of 1</span>
                                                            <button class="btn btn-sm btn-outline-secondary" onclick="nextPage(${obsIdx}, ${taskIdx}, ${index})">
                                                                <i class="fas fa-chevron-right"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                    <div class="pdf-viewer-wrapper" style="position: relative; border: 1px solid #dee2e6; border-radius: 5px;">
                                                        <canvas id="pdf-canvas-${obsIdx}-${taskIdx}-${index}" style="width: 100%; height: auto;"></canvas>
                                                        <div id="pdf-annotations-${obsIdx}-${taskIdx}-${index}" class="pdf-annotations-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></div>
                                                    </div>
                                                </div>
                                            ` : ''}
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}
            `;

            resultContainer.innerHTML = resultHTML;

            // Initialize PDF viewers and annotations for individual documents
            setTimeout(() => {
                if (result.individual_results) {
                    result.individual_results.forEach((docResult, index) => {
                        if (docResult.result.pdf_filename) {
                            initializePDFViewer(obsIdx, taskIdx, docResult.result.pdf_filename, index);
                        }
                        if (docResult.result.annotations && docResult.result.annotations.length > 0) {
                            initializeAnnotations(docResult.result.annotations, obsIdx, taskIdx, index);
                        }
                    });

                    // Add accordion event listeners to reposition highlights when panels are shown
                    const accordion = document.getElementById(`accordion-${obsIdx}-${taskIdx}`);
                    if (accordion) {
                        const collapseElements = accordion.querySelectorAll('.accordion-collapse');
                        collapseElements.forEach((collapse, index) => {
                            collapse.addEventListener('shown.bs.collapse', () => {
                                console.log('Accordion panel shown for document', index);
                                const key = `${obsIdx}-${taskIdx}-${index}`;
                                const viewer = window.pdfViewers?.get(key);
                                if (viewer) {
                                    // Small delay to ensure element is fully rendered
                                    setTimeout(() => {
                                        viewer.repositionHighlights();
                                    }, 200);
                                }
                            });
                        });
                    }
                }
            }, 100);
        }

        function addMoreEvidence(obsIdx, taskIdx) {
            // Show multi-upload option
            showMultiUpload(obsIdx, taskIdx);
            // Trigger file input
            document.getElementById(`evidence-multi-${obsIdx}-${taskIdx}`).click();
        }
    </script>

    <!-- PDF Viewer JavaScript -->
    <script src="/static/pdf_viewer.js"></script>

    <!-- Annotation System JavaScript -->
    <script src="/static/annotation_system.js"></script>
</body>
</html>
